[Settings]
; Hold this key while scrolling the mouse wheel (hex VK). 11=Ctrl, 12=Alt, 00=none
Modifier=11
; Change in stick limit per wheel notch (0.05 = 5%)
Step=0.05
; Lowest limit (fraction of full stick range)
Min=0.10
; Limit at launch (1.0 = normal full range)
Start=1.0
; Left-stick dead zone the game uses (XInput default 7849). Raise if low settings make you stop moving.
DeadZone=7849
; Controller control: hold Back/View + D-Pad Up/Down to change the limit
PadAdjust=1
ShowInTitle=1
DebugLog=1
; Ctrl + middle mouse click = reset to full range
