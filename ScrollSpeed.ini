[Settings]
; Hold this key while scrolling (hex VK). 11=Ctrl, 12=Alt, 00=none
Modifier=11
Step=0.25
Min=0.25
Max=8.0
; Multiplier applied automatically after the scan (1.0 = leave vanilla)
Start=1.0
; Flat=1: set ALL 16 levels to (level-15 value x multiplier). Flat=0: scale each level's own value.
Flat=1
; Auto-scan memory this long after launch. Load a save first! (F6 rescans any time)
ScanDelayMs=45000
ShowInTitle=1
DebugLog=1
