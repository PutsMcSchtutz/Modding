[Settings]
; ScrollSpeed keyboard/mouse-only configuration
; Native WASD input is preserved; no XInput/controller hooks are installed.

; ================= CORE =================
Enabled=1
WheelAdjust=1
BaseSpeed=1
; Apply the movement-vector multiplier to native WASD input.
; Set to 0 to disable keyboard speed scaling without affecting native WASD.
KeyboardVector=1

; ================= WHEEL SPEED =================
; Hex VK: 11=Ctrl, 12=Alt, 00=wheel always adjusts (blocks game's wheel use).
Modifier=11
; Speed change per wheel notch.
Step=0.05
; Lowest movement multiplier.
Min=0.10
; Initial movement multiplier when BaseSpeed=1.
Start=0.80

; ================= WEAPON / COMBAT STATES =================
; Weapon drawn is UNSHEATHED, not automatically COMBAT.
; Actual combat is inferred from attack/guard input and expires after CombatHoldMs.
CombatDetect=1
; 1 = while actively fighting, Ctrl+wheel UP=run, DOWN=walk; Alt+Ctrl+wheel tunes combat walk multiplier.
CombatBinary=1
CombatWalkStick=0.30
; Active combat timeout after the last attack/guard input. 0 = remain active until weapon is stowed.
CombatHoldMs=5000
; T draw/stow toggle; 00=none.
WeaponKey=54
; Additional hex VKs that draw the weapon (comma-separated).
UnsheathKeys=
; Pause/Break manually corrects the mod's weapon-state belief; this does not toggle combat.
WeaponStateOverrideKey=13

; ================= OPTIONAL RUN CONVENIENCE =================
; Scroll down while running outside active combat sends a brief Shift tap to return to walk.
; This is unrelated to unsheathing; set to 0 to disable all injected Shift taps.
JogToWalk=0

; ================= KEYBOARD / DIAGNOSTICS =================
; Scroll Lock toggles keyboard vector scaling on/off; WASD remains native either way.
KeyboardToggle=91
ShowInTitle=1
DebugLog=1
DebugKeys=0
