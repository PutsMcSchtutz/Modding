[Settings]
; Hold this key while scrolling. Hex virtual-key code. 11=Ctrl, 12=Alt, 10=Shift, 00=none (wheel always active)
Modifier=11
; Movement multiplier change per wheel notch
Step=0.25
Min=0.25
Max=8.0
; Multiplier at game launch (1.0 = normal)
Start=1.0
; Show the current multiplier in the game window title bar
ShowInTitle=1
; Ignore position changes bigger than this per update (stops teleports/fast travel being scaled)
MaxDeltaPerUpdate=5.0
; Which two components of the position vector are horizontal (0=x 1=y 2=z). Default x and z.
AxisA=0
AxisB=2
; Wait this long after launch before patching
InitDelayMs=3000
DebugLog=0
; Modifier + Middle Mouse Button = reset to 1.0x
